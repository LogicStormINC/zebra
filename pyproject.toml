[project]
name = "zebra-agent-workspace"
version = "0.1.0"
description = "Workspace root for the Zebra Agent engineering platform."
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Luke Ding" }]
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=8.4.2,<9.0.0",
    "ruff>=0.12.12,<0.13.0",
    "mypy>=1.20.2,<2.0.0",
    "uvicorn>=0.35.0,<0.36.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/cli",
    "apps/api",
    "apps/config",
    "apps/worker",
    "packages/agent-core",
    "packages/agent-context",
    "packages/agent-integrations",
    "packages/agent-storage",
    "packages/agent-tools",
    "packages/agent-security",
    "packages/agent-runtime",
    "packages/agent-observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
