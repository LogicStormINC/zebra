# Private operator service, not a public multi-tenant search website.
use_default_settings:
  engines:
    keep_only: [yahoo, bing, sogou, 360search, sogou wechat]
engines:
  - name: yahoo
    disabled: false
    timeout: 5.0
  - name: bing
    disabled: true
    inactive: false
    base_url: https://cn.bing.com
  # disabled excludes default fan-out, not explicit native !engine selection.
  # ponytail: one default avoids cross-engine failures; qualify before enabling more.
  - name: sogou
    disabled: true
    inactive: false
    shortcut: sogou
    timeout: 5.0
  - name: 360search
    disabled: true
    inactive: false
    shortcut: 360so
    timeout: 5.0
  - name: sogou wechat
    disabled: true
    inactive: false
    shortcut: sogouw
    timeout: 5.0
server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
search:
  formats: [html, json]
  safe_search: 1
  default_lang: zh-CN
outgoing:
  request_timeout: 5.0
  max_request_timeout: 6.0
  pool_connections: 20
