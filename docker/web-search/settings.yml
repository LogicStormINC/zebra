# Private operator service, not a public multi-tenant search website.
use_default_settings:
  engines:
    keep_only: [yahoo, bing, sogou, 360search, sogou wechat]
engines:
  # Explicit opt-in only; keep this entry equal to zebra_exa.OPTIONAL_CONFIG.
  - name: exa
    engine: zebra_exa
    shortcut: exa
    disabled: true
    inactive: false
    timeout: 6.0
    retries: 0
  - name: yahoo
    disabled: false
    timeout: 5.0
    # ponytail: recover an invalid HTTP status once using SearXNG's existing client retry.
    retries: 1
    retry_on_http_error: [0]
  - name: bing
    disabled: true
    inactive: false
    base_url: https://cn.bing.com
  # disabled excludes default fan-out, not explicit native !engine selection.
  # ponytail: one default avoids cross-engine failures; qualify before enabling more.
  - name: sogou
    disabled: true
    inactive: false
    shortcut: sogou
    timeout: 5.0
  - name: 360search
    disabled: true
    inactive: false
    shortcut: 360so
    timeout: 5.0
  - name: sogou wechat
    disabled: true
    inactive: false
    shortcut: sogouw
    timeout: 5.0
server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
search:
  formats: [html, json]
  safe_search: 1
  # Agent queries may mix languages; do not force Yahoo's lang_zh_chs cookie.
  default_lang: all
  autocomplete: ""
  favicon_resolver: ""
  max_page: 1
  # Respect upstream rejection; never retry CAPTCHA/403/429 immediately.
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
outgoing:
  request_timeout: 5.0
  max_request_timeout: 6.0
  pool_connections: 20
  enable_http2: true
