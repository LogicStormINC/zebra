name: zebra-application

x-zebra-cloud-environment: &zebra-cloud-environment
  ZEBRA_PROFILE: cloud
  ZEBRA_DATABASE_URL: ${ZEBRA_DATABASE_URL:?set ZEBRA_DATABASE_URL}
  ZEBRA_RUNTIME_CLASS: ${ZEBRA_RUNTIME_CLASS:?set ZEBRA_RUNTIME_CLASS}
  ZEBRA_RUNTIME_IMAGE: ${ZEBRA_RUNTIME_IMAGE:?set ZEBRA_RUNTIME_IMAGE}
  ZEBRA_RUNTIME_REQUIRE_WORKSPACE_QUOTA: ${ZEBRA_RUNTIME_REQUIRE_WORKSPACE_QUOTA:-true}
  ZEBRA_DEPLOYMENT_NAMESPACE: ${ZEBRA_DEPLOYMENT_NAMESPACE:?set ZEBRA_DEPLOYMENT_NAMESPACE}
  ZEBRA_AUTHORITY_ISSUER: ${ZEBRA_AUTHORITY_ISSUER:?set ZEBRA_AUTHORITY_ISSUER}
  ZEBRA_HISTORY_SCOPE_NAMESPACE: ${ZEBRA_HISTORY_SCOPE_NAMESPACE:?set ZEBRA_HISTORY_SCOPE_NAMESPACE}
  ZEBRA_CONTINUATION_SCOPE_NAMESPACE: ${ZEBRA_CONTINUATION_SCOPE_NAMESPACE:?set ZEBRA_CONTINUATION_SCOPE_NAMESPACE}
  ZEBRA_MEMORY_CURSOR_SIGNING_KEY: ${ZEBRA_MEMORY_CURSOR_SIGNING_KEY:?set ZEBRA_MEMORY_CURSOR_SIGNING_KEY}
  ZEBRA_S3_ENDPOINT: ${ZEBRA_S3_ENDPOINT:?set ZEBRA_S3_ENDPOINT}
  ZEBRA_S3_BUCKET: ${ZEBRA_S3_BUCKET:?set ZEBRA_S3_BUCKET}
  ZEBRA_S3_ACCESS_KEY: ${ZEBRA_S3_ACCESS_KEY:?set ZEBRA_S3_ACCESS_KEY}
  ZEBRA_S3_SECRET_KEY: ${ZEBRA_S3_SECRET_KEY:?set ZEBRA_S3_SECRET_KEY}
  ZEBRA_S3_REGION: ${ZEBRA_S3_REGION:-us-east-1}
  ZEBRA_S3_KEY_PREFIX: ${ZEBRA_S3_KEY_PREFIX:-zebra/artifacts/v1}
  ZEBRA_API_AUTH_TOKEN: ${ZEBRA_API_AUTH_TOKEN:-}
  ZEBRA_LIVE_REDIS_URL: ${ZEBRA_LIVE_REDIS_URL:-redis://redis-live:6379/0}
  ZEBRA_LIVE_STREAM_MAX_LENGTH: ${ZEBRA_LIVE_STREAM_MAX_LENGTH:-1000}
  ZEBRA_LIVE_STREAM_KEY_PREFIX: ${ZEBRA_LIVE_STREAM_KEY_PREFIX:-zebra:live:v1}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ZEBRA_WORKSPACE_VOLUME_ROOT: ${ZEBRA_WORKSPACE_VOLUME_ROOT:-}
  ZEBRA_HOST_TOOL_ENDPOINT: ${ZEBRA_HOST_TOOL_ENDPOINT:-}
  ZEBRA_HOST_TOOL_WORKLOAD_IDENTITY: ${ZEBRA_HOST_TOOL_WORKLOAD_IDENTITY:-}
  ZEBRA_HOST_TOOL_SHARED_SECRET: ${ZEBRA_HOST_TOOL_SHARED_SECRET:-}
  ZEBRA_HOST_TOOL_SSRF_ALLOW_HOSTNAMES: ${ZEBRA_HOST_TOOL_SSRF_ALLOW_HOSTNAMES:-}
  ZEBRA_WORKSPACE_VOLUME_LAYOUT: ${ZEBRA_WORKSPACE_VOLUME_LAYOUT:-}
  DOCKER_HOST: ${DOCKER_HOST:-}

x-zebra-application-build: &zebra-application-build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    ZEBRA_PYTHON_BASE_IMAGE: ${ZEBRA_APPLICATION_PYTHON_BASE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/python:3.12-slim-bookworm}

services:
  zebra-migrate:
    build:
      <<: *zebra-application-build
      target: migrate
    environment: *zebra-cloud-environment
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [dependencies]

  zebra-api:
    build:
      <<: *zebra-application-build
      target: api
    environment: *zebra-cloud-environment
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - ./trench-acceptance/secrets/ca.crt:/etc/ssl/certs/${ZEBRA_LOCAL_CA_HASH:-zebra-local-unused}.0:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ZEBRA_WORKSPACE_VOLUME_ROOT:-/var/lib/zebra/workspaces}:${ZEBRA_WORKSPACE_VOLUME_ROOT:-/var/lib/zebra/workspaces}
    group_add:
      - ${ZEBRA_DOCKER_SOCKET_GID:-984}
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      zebra-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ZEBRA_API_PORT:-18080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [dependencies]

  zebra-worker:
    build:
      <<: *zebra-application-build
      target: worker-engine
    environment:
      <<: *zebra-cloud-environment
      ZEBRA_WORKER_ID: ${ZEBRA_WORKER_ID:-zebra-cloud-worker}
    restart: unless-stopped
    command:
      - --worker-id
      - ${ZEBRA_WORKER_ID:-zebra-cloud-worker}
      - --idle-sleep-seconds
      # ponytail: 100 ms bounds pilot latency; replace polling with a global
      # Redis wake stream before scaling Worker replicas materially.
      - "${ZEBRA_WORKER_IDLE_SLEEP_SECONDS:-0.1}"
    init: true
    read_only: true
    volumes:
      - ./trench-acceptance/secrets/ca.crt:/etc/ssl/certs/${ZEBRA_LOCAL_CA_HASH:-zebra-local-unused}.0:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ZEBRA_WORKSPACE_VOLUME_ROOT:-/var/lib/zebra/workspaces}:${ZEBRA_WORKSPACE_VOLUME_ROOT:-/var/lib/zebra/workspaces}
    group_add:
      - ${ZEBRA_DOCKER_SOCKET_GID:-984}
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      zebra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, kill -0 1]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [dependencies]

networks:
  dependencies:
    name: ${ZEBRA_APPLICATION_NETWORK:-zebra-dependencies}
    external: true
