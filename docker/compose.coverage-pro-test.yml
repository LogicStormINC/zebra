# Opt-in local strict-coverage model profile. Append after application/gVisor files.
# This file does not enable admission/receipts, change authority, or start services.
# API admission hashes the model descriptor: changing only Worker breaks matching.
x-coverage-pro-model: &coverage-pro-model
  ZEBRA_MODEL_PROVIDER: deepseek
  ZEBRA_MODEL_NAME: deepseek-v4-pro
  DEEPSEEK_MODEL: deepseek-v4-pro
  ZEBRA_MODEL_BASE_URL: https://api.deepseek.com
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  ZEBRA_DEEPSEEK_REVIEWER_PROFILE: deepseek-v4-pro-reviewer-v1
  ZEBRA_DEEPSEEK_WIRE_API: chat_completions

services:
  zebra-api:
    environment: *coverage-pro-model
  zebra-api-legacy:
    environment: *coverage-pro-model
  zebra-worker:
    environment: *coverage-pro-model
