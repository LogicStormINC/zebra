# Connect the existing application Worker to a local Linux VM's mTLS Docker bridge.
# No control-plane services or their data move to the VM.
services:
  zebra-worker:
    environment:
      DOCKER_HOST: tcp://${ZEBRA_LOCAL_GVISOR_ADDRESS:?set the verified local VM IP}:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /run/zebra-engine-tls
      ZEBRA_OCI_INFO_CONNECT_PROXY: ${ZEBRA_LOCAL_GVISOR_INFO_CONNECT_PROXY:-}
    volumes: !override
      - ${ZEBRA_WORKSPACE_VOLUME_ROOT:?keep the verified shared workspace}:${ZEBRA_WORKSPACE_VOLUME_ROOT}
      - ${ZEBRA_LOCAL_GVISOR_CLIENT_CERT_DIR:?set the verified engine client certificate directory}:/run/zebra-engine-tls:ro
    group_add:
      - ${ZEBRA_LOCAL_GVISOR_CERT_GID:?set the client certificate group}
