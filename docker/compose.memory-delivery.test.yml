name: zebra-memory-delivery-test

# Dependency-only test profile. The PostgreSQL container is intentionally
# separate from the host-runner (the Zebra application containers remain out
# of scope until cloud composition is activated).
services:
  postgres:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: zebra
      POSTGRES_USER: zebra
      POSTGRES_PASSWORD: zebra-test-password
    ports:
      - "127.0.0.1:${ZEBRA_MEMORY_DELIVERY_POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - dependencies

volumes:
  postgres-data:

networks:
  dependencies:
    name: zebra-memory-delivery-test-dependencies
