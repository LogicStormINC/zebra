# Single-node local acceptance. Production requires TLS and a three-node quorum.
loopback_users.guest = true
max_message_size = 16384
channel_max = 32
heartbeat = 30
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 100MB
management.rates_mode = basic
prometheus.return_per_object_metrics = false

listeners.tcp.default = 25672
management.tcp.port = 25673
prometheus.tcp.port = 25692
distribution.listener.port_range.min = 25674
distribution.listener.port_range.max = 25674
