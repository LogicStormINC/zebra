name: zebra-s3-recovery-test

services:
  postgres:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: zebra
      POSTGRES_USER: zebra
      POSTGRES_PASSWORD: zebra-test-password
    ports:
      - "127.0.0.1:${ZEBRA_S3_RECOVERY_POSTGRES_PORT:-25467}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - dependencies

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: zebra-recovery
      MINIO_ROOT_PASSWORD: zebra-recovery-test-secret
    ports:
      - "127.0.0.1:${ZEBRA_S3_RECOVERY_MINIO_PORT:-19003}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - dependencies

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: zebra-recovery
      MINIO_ROOT_PASSWORD: zebra-recovery-test-secret
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set zebra http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing zebra/zebra-artifacts
        mc mb --ignore-existing zebra/zebra-artifacts-backup
        mc version enable zebra/zebra-artifacts
        mc version enable zebra/zebra-artifacts-backup
    networks:
      - dependencies

volumes:
  postgres-data:
  minio-data:

networks:
  dependencies:
    name: zebra-s3-recovery-test-dependencies
