name: zebra-cloud-faults

services:
  postgres:
    image: postgres:17.5-alpine3.21
    environment:
      POSTGRES_DB: zebra
      POSTGRES_USER: zebra
      POSTGRES_PASSWORD: zebra-test-password
    ports:
      - "127.0.0.1:${ZEBRA_CLOUD_FAULTS_POSTGRES_PORT:-25499}:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks: [dependencies]

networks:
  dependencies: {}
