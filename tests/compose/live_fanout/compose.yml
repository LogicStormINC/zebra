services:
  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:${ZEBRA_LIVE_REDIS_PORT:-16381}:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - live-fanout

networks:
  live-fanout:
    name: zebra-live-fanout-test-dependencies
