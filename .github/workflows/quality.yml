name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Install locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Run tests
        run: make test
      - name: Run static and release gates
        run: make check

  desktop:
    name: Desktop quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    defaults:
      run:
        working-directory: UI/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.0"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install locked Python workspace
        run: uv sync --project ../.. --frozen --all-packages --group dev
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop contract checks
        run: pnpm run "/^check:/"
      - name: Build desktop web assets
        run: pnpm build
      - name: Run real browser streaming regressions
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: pnpm e2e --reporter=line,json
      - name: Retain machine-readable streaming evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-streaming-evidence
          path: UI/desktop/playwright-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-playwright-evidence
          path: |
            UI/desktop/playwright-report
            UI/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  packaged-desktop:
    name: Packaged Tauri Runtime E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Tauri, WebDriver, and OS sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bubblewrap \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.17.0"
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.89.0"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install locked workspaces
        run: |
          pnpm --dir UI/desktop install --frozen-lockfile --ignore-scripts
          uv sync --frozen --all-packages --group dev
      - name: Install pinned Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Build packaged Debian application
        working-directory: UI/desktop
        run: pnpm exec tauri build --ci --bundles deb -- --locked
      - name: Drive packaged app through real API, Worker, and OS sandbox
        run: |
          mkdir -p packaged-desktop-evidence
          for attempt in 1 2; do
            log="packaged-desktop-evidence/attempt-${attempt}.log"
            set +e
            xvfb-run -a uv run python scripts/packaged_desktop_e2e.py \
              --application UI/desktop/src-tauri/target/release/zebra-agent-desktop-ui \
              --evidence packaged-desktop-evidence/result.json \
              --screenshot packaged-desktop-evidence/final.png 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 2 ] || ! grep -Eq \
              "Connection reset by peer|connection closed before message completed" "$log"; then
              exit "$status"
            fi
            echo "::warning::tauri-driver connection reset; retrying packaged drive once"
          done
      - name: Retain package and E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-tauri-runtime-evidence
          path: |
            UI/desktop/src-tauri/target/release/bundle/deb/*.deb
            packaged-desktop-evidence
          if-no-files-found: warn
          retention-days: 14

  gvisor-runtime:
    name: Real gVisor runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Install locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Install verified runsc release
        run: |
          arch="$(uname -m)"
          release="https://storage.googleapis.com/gvisor/releases/release/latest/${arch}"
          curl --fail --silent --show-error --location --remote-name "${release}/runsc"
          curl --fail --silent --show-error --location --remote-name "${release}/runsc.sha512"
          sha512sum --check runsc.sha512
          chmod 0755 runsc
          sudo mv runsc /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
      - name: Resolve smoke image digest
        run: |
          docker pull alpine:3.22
          image="$(docker image inspect alpine:3.22 --format '{{index .RepoDigests 0}}')"
          echo "ZEBRA_GVISOR_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Run real gVisor isolation smoke
        env:
          ZEBRA_GVISOR_SMOKE: "1"
        run: uv run pytest -q --junitxml=gvisor-runtime.xml tests/agent_runtime/test_gvisor_smoke.py
      - name: Retain gVisor evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gvisor-runtime-evidence
          path: gvisor-runtime.xml
          retention-days: 14

  workspace-quota:
    name: Real workspace quota exhaustion
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Install locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Mount dedicated 8 MiB workspace
        run: |
          sudo mkdir -p /mnt/zebra-quota-smoke
          sudo mount -t tmpfs -o size=8m,nosuid,nodev,noexec tmpfs /mnt/zebra-quota-smoke
          sudo chown "$(id -u):$(id -g)" /mnt/zebra-quota-smoke
      - name: Prove storage-enforced ENOSPC
        env:
          ZEBRA_QUOTA_SMOKE_ROOT: /mnt/zebra-quota-smoke
          ZEBRA_RUNTIME_EVIDENCE_PATH: workspace-quota.json
        run: >-
          uv run pytest -q --junitxml=workspace-quota.xml
          tests/agent_runtime/test_workspace_quota_smoke.py
      - name: Unmount quota workspace
        if: always()
        run: sudo umount /mnt/zebra-quota-smoke || true
      - name: Retain quota evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-quota-evidence
          path: |
            workspace-quota.json
            workspace-quota.xml
          if-no-files-found: error
          retention-days: 14

  os-sandbox-runtime:
    name: Real OS sandbox smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true
          python-version: "3.12"
          version: "0.11.12"
      - name: Install locked workspace
        run: uv sync --frozen --all-packages --group dev
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Run real native isolation smoke
        env:
          ZEBRA_OS_SANDBOX_SMOKE: "1"
          ZEBRA_RUNTIME_SOAK: "1"
          ZEBRA_RUNTIME_EVIDENCE_PATH: runtime-soak.json
        run: >-
          uv run pytest -q --junitxml=os-sandbox-runtime.xml
          tests/agent_runtime/test_os_sandbox_smoke.py
          tests/agent_runtime/test_runtime_soak.py
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-sandbox-${{ runner.os }}-evidence
          path: |
            os-sandbox-runtime.xml
            runtime-soak.json
          if-no-files-found: error
          retention-days: 14
