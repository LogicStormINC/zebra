name: TypeScript SDK

on:
  pull_request:
    paths:
      - ".github/workflows/typescript-sdk.yml"
      - "sdks/typescript/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/typescript-sdk.yml"
      - "sdks/typescript/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: sdks/typescript/.node-version
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install locked SDK dependencies
        run: pnpm --dir sdks/typescript install --frozen-lockfile
      - name: Install browser runtime
        run: pnpm --dir sdks/typescript exec playwright install --with-deps chromium webkit
      - name: Verify packages and real consumers
        run: pnpm --dir sdks/typescript verify
