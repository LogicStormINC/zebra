apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zebra-agent.fullname" . }}-api
  labels:
    {{- include "zebra-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  {{- if .Values.databaseBudget.enabled }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "zebra-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "zebra-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "zebra-agent.serviceAccountName" . }}
      automountServiceAccountToken: false
      runtimeClassName: {{ required "runtimeClassName must be gvisor" .Values.runtimeClassName | quote }}
      securityContext:
        {{- include "zebra-agent.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "zebra-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, zebra_agent_api.server]
          env:
            {{- include "zebra-agent.cloudEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ ternary "/health/ready" "/health" .Values.databaseBudget.enabled }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ ternary "/health/live" "/health" .Values.databaseBudget.enabled }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ ternary "/health/live" "/health" .Values.databaseBudget.enabled }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "zebra-agent.containerSecurityContext" . | nindent 12 }}
