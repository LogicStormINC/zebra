apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zebra-agent.fullname" . }}-worker
  labels:
    {{- include "zebra-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "zebra-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "zebra-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "zebra-agent.serviceAccountName" . }}
      automountServiceAccountToken: false
      runtimeClassName: {{ required "runtimeClassName must be gvisor" .Values.runtimeClassName | quote }}
      securityContext:
        {{- include "zebra-agent.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "zebra-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [zebra-agent-worker]
          args: [--worker-id, "{{ include "zebra-agent.fullname" . }}", --idle-sleep-seconds, "{{ .Values.worker.idleSleepSeconds }}"]
          env:
            {{- include "zebra-agent.cloudEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "zebra-agent.containerSecurityContext" . | nindent 12 }}
