apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zebra-agent.fullname" . }}-migrate
  labels:
    {{- include "zebra-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "zebra-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "zebra-agent.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      runtimeClassName: {{ required "runtimeClassName must be gvisor" .Values.runtimeClassName | quote }}
      securityContext:
        {{- include "zebra-agent.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "zebra-agent.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, docker/migrate.py]
          env:
            {{- include "zebra-agent.cloudEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- include "zebra-agent.containerSecurityContext" . | nindent 12 }}
