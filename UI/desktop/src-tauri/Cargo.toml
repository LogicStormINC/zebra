[package]
name = "zebra-agent-desktop-ui"
version = "0.1.0"
description = "Zebra Agent desktop operator shell"
authors = ["lukeding"]
edition = "2021"

[lib]
name = "zebra_agent_desktop_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = [] }
