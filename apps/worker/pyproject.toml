[project]
name = "zebra-agent-worker"
version = "0.1.0"
description = "Worker composition root for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-storage",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
