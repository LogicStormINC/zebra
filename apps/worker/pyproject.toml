[project]
name = "zebra-agent-worker"
version = "0.1.0"
description = "Worker composition root for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-integrations",
    "agent-runtime",
    "agent-storage",
    "agent-security",
    "agent-tools",
    "zebra-agent-config",
]

[project.scripts]
zebra-agent-worker = "zebra_agent_worker.main:main"

[tool.uv.sources]
agent-core = { workspace = true }
agent-integrations = { workspace = true }
agent-runtime = { workspace = true }
agent-storage = { workspace = true }
agent-security = { workspace = true }
agent-tools = { workspace = true }
zebra-agent-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
