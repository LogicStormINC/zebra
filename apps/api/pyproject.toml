[project]
name = "zebra-agent-api"
version = "0.1.0"
description = "API composition root for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-integrations",
    "agent-security",
    "agent-storage",
    "fastapi>=0.116.1,<0.117.0",
    "pypdf>=6.14.2,<7.0.0",
    "uvicorn>=0.35.0,<0.36.0",
    "zebra-agent-config",
]

[project.optional-dependencies]
# Local-profile inline execution; cloud-only deployments omit this extra so
# the API artifact packages neither the Worker nor the Runtime (ADR-017).
local = [
    "agent-runtime",
    "zebra-agent-worker",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-integrations = { workspace = true }
agent-runtime = { workspace = true }
agent-security = { workspace = true }
agent-storage = { workspace = true }
zebra-agent-config = { workspace = true }
zebra-agent-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
