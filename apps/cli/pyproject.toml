[project]
name = "zebra-agent-cli"
version = "0.1.0"
description = "CLI composition root for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-integrations",
    "agent-storage",
    "zebra-agent-config",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-integrations = { workspace = true }
agent-storage = { workspace = true }
zebra-agent-config = { workspace = true }

[project.scripts]
zebra-agent = "zebra_agent_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
