version = "0.1.0"
source = { editable = "apps/api" }
dependencies = [
    { name = "agent-core" },
    { name = "agent-integrations" },
    { name = "agent-runtime" },
    { name = "agent-security" },
    { name = "agent-storage" },
    { name = "fastapi" },
    { name = "pypdf" },
    { name = "zebra-agent-config" },
    { name = "zebra-agent-worker" },
]

[package.metadata]
requires-dist = [
    { name = "agent-core", editable = "packages/agent-core" },
    { name = "agent-integrations", editable = "packages/agent-integrations" },
    { name = "agent-runtime", editable = "packages/agent-runtime" },
    { name = "agent-security", editable = "packages/agent-security" },
    { name = "agent-storage", editable = "packages/agent-storage" },
    { name = "fastapi", specifier = ">=0.116.1,<0.117.0" },
    { name = "pypdf", specifier = ">=6.14.2,<7.0.0" },
    { name = "zebra-agent-config", editable = "apps/config" },
    { name = "zebra-agent-worker", editable = "apps/worker" },
]

[[package]]
name = "zebra-agent-cli"
version = "0.1.0"
source = { editable = "apps/cli" }
dependencies = [
    { name = "agent-core" },
    { name = "agent-integrations" },
    { name = "agent-runtime" },
    { name = "agent-security" },
    { name = "agent-storage" },
    { name = "agent-tools" },
    { name = "zebra-agent-config" },
    { name = "zebra-agent-worker" },
]

[package.metadata]
requires-dist = [
    { name = "agent-core", editable = "packages/agent-core" },
    { name = "agent-integrations", editable = "packages/agent-integrations" },
    { name = "agent-runtime", editable = "packages/agent-runtime" },
    { name = "agent-security", editable = "packages/agent-security" },
    { name = "agent-storage", editable = "packages/agent-storage" },
    { name = "agent-tools", editable = "packages/agent-tools" },
    { name = "zebra-agent-config", editable = "apps/config" },
    { name = "zebra-agent-worker", editable = "apps/worker" },
]

[[package]]
name = "zebra-agent-config"
version = "0.1.0"
source = { editable = "apps/config" }

[[package]]
name = "zebra-agent-worker"
version = "0.1.0"
source = { editable = "apps/worker" }
dependencies = [
    { name = "agent-core" },
    { name = "agent-integrations" },
    { name = "agent-runtime" },
    { name = "agent-security" },
    { name = "agent-storage" },
    { name = "zebra-agent-config" },
]

[package.metadata]
requires-dist = [
    { name = "agent-core", editable = "packages/agent-core" },
    { name = "agent-integrations", editable = "packages/agent-integrations" },
    { name = "agent-runtime", editable = "packages/agent-runtime" },
    { name = "agent-security", editable = "packages/agent-security" },
    { name = "agent-storage", editable = "packages/agent-storage" },
    { name = "zebra-agent-config", editable = "apps/config" },
]

[[package]]
name = "zebra-agent-workspace"
version = "0.1.0"
source = { virtual = "." }

[package.dev-dependencies]
dev = [
    { name = "ag-ui-protocol" },
    { name = "httpx" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "uvicorn" },
]

[package.metadata]

[package.metadata.requires-dev]
dev = [
    { name = "ag-ui-protocol", specifier = "==0.1.19" },
    { name = "httpx", specifier = ">=0.28.1,<0.29.0" },
    { name = "mypy", specifier = ">=1.20.2,<2.0.0" },
    { name = "pytest", specifier = ">=8.4.2,<9.0.0" },
    { name = "ruff", specifier = ">=0.12.12,<0.13.0" },
    { name = "uvicorn", specifier = ">=0.35.0,<0.36.0" },
]
