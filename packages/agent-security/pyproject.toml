[project]
name = "agent-security"
version = "0.1.0"
description = "Policy and security package for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-tools",
    "PyJWT[crypto]>=2.10.1,<3.0.0",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
