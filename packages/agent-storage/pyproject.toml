[project]
name = "agent-storage"
version = "0.1.0"
description = "Durable storage adapters for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-orchestration==0.1.0",
    "botocore>=1.42.97,<1.43.0",
    "psycopg[binary]>=3.2.10,<4.0.0",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-orchestration = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
