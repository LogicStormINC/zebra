[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Agent Layer application services: admission, capability binding, task binding, command, query replay, usage, and host registry."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
]

[tool.uv.sources]
agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
