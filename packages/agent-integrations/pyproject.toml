[project]
name = "agent-integrations"
version = "0.1.0"
description = "Provider integrations for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-tools",
    "httpx>=0.28.1,<0.29.0",
    "zebra-agent-config",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-tools = { workspace = true }
zebra-agent-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
