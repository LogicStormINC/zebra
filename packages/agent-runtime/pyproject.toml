[project]
name = "agent-runtime"
version = "0.1.0"
description = "Runtime abstractions for Zebra Agent."
requires-python = ">=3.12,<4.0"
dependencies = [
    "agent-core",
    "agent-security",
    "agent-storage",
    "agent-tools",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-security = { workspace = true }
agent-storage = { workspace = true }
agent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
